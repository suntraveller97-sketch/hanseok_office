<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F2EC"/>
<text x="76" y="93.0" font-size="24" font-weight="700" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#1C1B19">BEHIND</text>
<text x="76" y="224.0" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">몰랐던</text>
<text x="76" y="300.8" font-size="58" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">비하인드 2가지</text>
<circle cx="86" cy="413.8" r="4" fill="#1C1B19"/>
<text x="106" y="422.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">20년 넘게 정체가 밝혀지지 않은,</text>
<text x="106" y="463.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">얼굴 없는 예술가 뱅크시</text>
<circle cx="86" cy="506.8" r="4" fill="#1C1B19"/>
<text x="106" y="515.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">경매 낙찰 직후 스스로 파쇄된</text>
<text x="106" y="556.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">'풍선을 든 소녀', 그 자체로 전설이 되다</text>
<rect x="76" y="1140" width="928" height="104" fill="#FFFFFF"/>
<text x="76" y="1198.0" font-size="27" font-weight="700" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">한 줄 요약: 예술계를 가장 크게 뒤흔든 반전의 작가</text>
<text text-anchor="end" x="1004" y="1294.0" font-size="22" font-weight="500" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#8A8375">4 / 5</text>
