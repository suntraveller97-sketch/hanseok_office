<text x="76" y="224.0" font-size="58" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">이대원 70년</text>
<text x="76" y="300.8" font-size="58" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">회고전, 덕수궁관</text>
<text x="76" y="377.6" font-size="28" font-weight="600" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#3A362F">국립현대미술관 덕수궁관 · 8.6~11.8</text>
<text x="76" y="421.6" font-size="26" font-weight="500" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#8A8375">기획전 관람료 2,000원 (덕수궁 입장료 별도)</text>
