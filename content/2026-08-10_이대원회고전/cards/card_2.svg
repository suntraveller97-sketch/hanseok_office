<text x="106" y="630.6" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">과수원·산·연못을 원색 점과 선으로</text>
<text x="106" y="671.1" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">그린 대표작 총망라</text>
<rect x="76" y="1140" width="928" height="104" fill="#FFFFFF"/>
<text x="76" y="1198.0" font-size="27" font-weight="700" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">한 줄 요약: 한국 근현대 회화사를 새로 쓴 화가의 최대 규모 회고전</text>
