<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F2EC"/>
<rect x="76" y="58" width="298" height="52" rx="26" fill="none" stroke="#B5482A" stroke-width="2.5"/>
<text x="108" y="93.0" font-size="24" font-weight="700" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#B5482A">HIGHLIGHT</text>
<text x="76" y="224.0" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">놓치면 아쉬운</text>
<text x="76" y="300.8" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">하이라이트 3</text>
<rect x="76" y="366.8" width="64" height="5" rx="2.5" fill="#B5482A"/>
<circle cx="86" cy="413.8" r="4" fill="#B5482A"/>
<text x="106" y="422.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">218개의 빈 액자로 존재의 경계를</text>
<text x="106" y="463.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">묻는 신작 '노바디(Nobody)'</text>
<circle cx="86" cy="506.8" r="4" fill="#B5482A"/>
<text x="106" y="515.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">40년 만에 돌아온 1987년作</text>
<text x="106" y="556.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">'저 너머', 이번 전시서 첫 공개</text>
<circle cx="86" cy="599.8" r="4" fill="#B5482A"/>
<text x="106" y="608.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">굴업도 해양쓰레기로 빚은 야외 신작</text>
<text x="106" y="649.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">'삶의 색채–모여라 꽃!'</text>
<rect x="76" y="1140" width="928" height="104" fill="#EDE6D9"/>
<rect x="76" y="1140" width="6" height="104" fill="#B5482A"/>
