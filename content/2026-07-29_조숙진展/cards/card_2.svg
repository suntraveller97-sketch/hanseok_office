<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F2EC"/>
<rect x="76" y="58" width="246" height="52" rx="26" fill="none" stroke="#B5482A" stroke-width="2.5"/>
<text x="108" y="93.0" font-size="24" font-weight="700" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#B5482A">PROFILE</text>
<text x="76" y="224.0" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">폐자재에서</text>
<text x="76" y="300.8" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">생명을 조각하다</text>
<rect x="76" y="366.8" width="64" height="5" rx="2.5" fill="#B5482A"/>
<circle cx="86" cy="413.8" r="4" fill="#B5482A"/>
<text x="106" y="422.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">1988년 미국 이주, 전설적 디렉터</text>
<text x="106" y="463.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">아이반 카프의 눈에 띈 조각가</text>
<circle cx="86" cy="506.8" r="4" fill="#B5482A"/>
<text x="106" y="515.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">백남준 이후 한국 작가로는 두 번째로</text>
<text x="106" y="556.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">미국 조각전문지 'Sculpture' 표지 장식</text>
<rect x="76" y="1140" width="928" height="104" fill="#EDE6D9"/>
<rect x="76" y="1140" width="6" height="104" fill="#B5482A"/>
<text x="112" y="1186.0" font-size="28" font-weight="700" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">한 줄 요약: 버려진 나무·창틀에서 생명을 찾아온 40년</text>
<text text-anchor="end" x="1004" y="1294.0" font-size="22" font-weight="500" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#8A8375">2 / 6</text>
</svg>
