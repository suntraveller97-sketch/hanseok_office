<text x="106" y="556.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">무료 전시도 함께, 부담 없이 즐기기 좋음</text>
<rect x="76" y="1140" width="928" height="104" fill="#FFFFFF"/>
<text x="76" y="1198.0" font-size="27" font-weight="700" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">한 줄 요약: 유료·무료 전시를 골라보는 알찬 사진 축제</text>
