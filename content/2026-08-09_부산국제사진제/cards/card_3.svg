<circle cx="86" cy="413.8" r="4" fill="#1C1B19"/>
<text x="106" y="422.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">'인간은 얼마나 존중받는가' 묻는</text>
<text x="106" y="463.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">주제전부터 청년작가전까지 다양한 스펙트럼</text>
