<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F2EC"/>
<text x="76" y="93.0" font-size="24" font-weight="700" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#1C1B19">BEHIND</text>
<text x="76" y="224.0" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">몰랐던</text>
<text x="76" y="300.8" font-size="58" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">비하인드 3가지</text>
<circle cx="86" cy="417.8" r="4" fill="#1C1B19"/>
<text x="106" y="426.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">고레에다 감독, 데뷔 이후 처음으로</text>
<text x="106" y="467.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">타인의 각본(사카모토 유지)으로 연출</text>
<circle cx="86" cy="510.8" r="4" fill="#1C1B19"/>
<text x="106" y="519.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">류이치 사카모토가 투병 중 남긴</text>
<text x="106" y="560.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">마지막 영화음악, 그대로 유작이 됨</text>
<circle cx="86" cy="603.8" r="4" fill="#1C1B19"/>
<text x="106" y="612.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">연출·각본·음악·연기 모든 요소가 고르게 호평받으며</text>
<text x="106" y="653.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">그해 '올해의 영화' 리스트에 다수 선정</text>
<rect x="76" y="1140" width="928" height="104" fill="#FFFFFF"/>
<text x="76" y="1198.0" font-size="27" font-weight="700" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">한 줄 요약: 두 거장의 마지막 협업이 남긴, 흠잡을 데 없는 스크린</text>
<text text-anchor="end" x="1004" y="1294.0" font-size="22" font-weight="500" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#8A8375">4 / 5</text>
</svg>
