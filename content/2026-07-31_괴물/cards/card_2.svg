<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F2EC"/>
<text x="76" y="93.0" font-size="24" font-weight="700" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#1C1B19">MOVIE</text>
<text x="76" y="224.0" font-size="54" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">초등학생 싸움 하나,</text>
<text x="76" y="300.8" font-size="58" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">세 개의 시선</text>
<text x="76" y="377.6" font-size="28" font-weight="600" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#3A362F">감독 고레에다 히로카즈 · 각본 사카모토 유지</text>
<text x="76" y="421.6" font-size="26" font-weight="500" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#8A8375">안도 사쿠라·나가야마 에이타·쿠로카와 소야 주연</text>
<circle cx="86" cy="492.6" r="4" fill="#1C1B19"/>
<text x="106" y="501.6" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">엄마·교사·아이, 세 사람의 시점으로</text>
<text x="106" y="542.1" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">다시 들려주는 같은 사건</text>
<circle cx="86" cy="569.6" r="4" fill="#1C1B19"/>
<text x="106" y="578.6" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">무엇이 진실이고 누가 '괴물'인지</text>
<text x="106" y="619.1" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">끝까지 되묻는 이야기</text>
<circle cx="86" cy="646.6" r="4" fill="#1C1B19"/>
<text x="106" y="655.6" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">안도 사쿠라의 섬세한 연기, 개봉 이후 지금까지</text>
<text x="106" y="696.1" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">'인생 연기'로 꼽히며 다시 회자되는 중</text>
<rect x="76" y="1140" width="928" height="104" fill="#FFFFFF"/>
<text x="76" y="1198.0" font-size="27" font-weight="700" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">한 줄 요약: 보고 나면 처음부터 다시 보고 싶어지는 영화</text>
<text text-anchor="end" x="1004" y="1294.0" font-size="22" font-weight="500" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#8A8375">2 / 5</text>
</svg>
