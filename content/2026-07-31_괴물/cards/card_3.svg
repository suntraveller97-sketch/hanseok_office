<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F2EC"/>
<text x="76" y="93.0" font-size="24" font-weight="700" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#1C1B19">WHY WATCH</text>
<text x="76" y="224.0" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">봐야 하는</text>
<text x="76" y="300.8" font-size="60" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">이유 3가지</text>
<circle cx="86" cy="417.8" r="4" fill="#1C1B19"/>
<text x="106" y="426.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">제76회 칸영화제 경쟁부문 초청,</text>
<text x="106" y="467.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">각본상·퀴어종려상 2관왕</text>
<circle cx="86" cy="510.8" r="4" fill="#1C1B19"/>
<text x="106" y="519.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">'라쇼몽'처럼 세 번 다시 보게 되는</text>
<text x="106" y="560.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">다중 시점 구성</text>
<circle cx="86" cy="603.8" r="4" fill="#1C1B19"/>
<text x="106" y="612.8" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">대형 신작들 개봉 속에서도 15주 차에 관객이 늘며</text>
<text x="106" y="653.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">150일 넘게 상영된 이례적인 흥행 기록</text>
<rect x="76" y="1140" width="928" height="104" fill="#FFFFFF"/>
<text x="76" y="1198.0" font-size="27" font-weight="700" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#1C1B19">한 줄 요약: 결말을 알고 다시 봐도, 150일간 사랑받은 이유가 있다</text>
<text text-anchor="end" x="1004" y="1294.0" font-size="22" font-weight="500" font-family="'Plex Mono','SFMono-Regular',monospace" fill="#8A8375">3 / 5</text>
