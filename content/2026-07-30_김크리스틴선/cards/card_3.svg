<text x="106" y="556.3" font-size="27" font-weight="400" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#2A2823">대표작 '완고한 바위, 무모한 싸움들'</text>
<rect x="76" y="1140" width="928" height="104" fill="#FFFFFF"/>
